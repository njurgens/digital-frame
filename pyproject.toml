[project]
name = "piframe"
version = "0.1.0"
description = "Raspberry Pi digital photo frame"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pygame",
    "Pillow",
    "requests",
    "numpy",
    "paramiko",
]

[project.scripts]
slideshow = "piframe.app:main"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "basedpyright>=1.39.9",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "RUF", "ANN201", "ANN001"]
extend-select = ["D100", "D101", "D102", "D103", "D104", "D105", "D107", "D200", "D201", "D202", "D204", "D205", "D207", "D208", "D209", "D210", "D211", "D213", "D300", "D301", "D400", "D401", "D402", "D403", "D404", "D405", "D408", "D411", "D412", "D413", "D414", "D415", "D416", "D417", "D418", "D419"]
# D211 (blank line before class) + D213 (summary on second line), no D203/D212 to avoid warnings

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
