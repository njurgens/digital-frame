[project]
name = "piframe"
version = "0.1.0"
description = "Raspberry Pi digital photo frame"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pygame",
    "Pillow",
    "requests",
    "numpy",
    "tomli-w>=1.2.0",
]

[project.scripts]
slideshow = "piframe.app:main"
piframe-ipc = "piframe.ipc_client:main"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    "diff-cover",
    "pyyaml",
    "basedpyright>=1.39.9",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 99
# Agent tooling is not project code; keep lint focused on src/tests (mirrors
# the basedpyright include list).
exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "RUF", "ANN201", "ANN001", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
