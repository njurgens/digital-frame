[project]
name = "piframe"
version = "0.1.0"
description = "Raspberry Pi digital photo frame"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pygame",
    "Pillow",
    "requests",
    "numpy",
    "paramiko",
]

[project.scripts]
slideshow = "piframe.app:main"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "basedpyright>=1.39.9",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "RUF", "ANN201", "ANN001", "D"]
ignore = ["D203", "D212"]  # prefer D211 (blank line before class) and D213 (summary on second line)

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
